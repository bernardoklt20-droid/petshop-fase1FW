<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro e Agendamento</title>

    <link rel="stylesheet" href="css/estilo.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header>

        <h1>Cadastro e Agendamento</h1>

        <nav>
            <a href="index.html">Início</a> |
            <a href="produtos.html">Produtos</a> |
            <a href="servicos.html">Serviços</a> |
            <a href="cadastro.html">Cadastro</a> |
            <a href="contato.html">Contato</a>
        </nav>

        <hr>

    </header>

    <main class="container">

        <h2>Dados do Cliente</h2>

        <form>

            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" placeholder="Digite seu nome" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Endereço</label>
                <input type="text" class="form-control" placeholder="Digite seu endereço" required>
            </div>

            <div class="mb-3">
                <label class="form-label">CPF</label>
                <input type="text" class="form-control" placeholder="Digite seu CPF" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="tel" class="form-control" placeholder="Digite seu telefone" required>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" placeholder="Digite seu e-mail" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Sexo</label>
                <br>

                <input type="radio" name="sexo"> Masculino
                <input type="radio" name="sexo"> Feminino
            </div>

            <hr>

            <h2>Dados do Pet</h2>

            <div class="mb-3">
                <label class="form-label">Nome do Pet</label>
                <input type="text" class="form-control" placeholder="Digite o nome do pet" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Raça</label>
                <input type="text" class="form-control" placeholder="Digite a raça" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Idade</label>
                <input type="number" class="form-control" min="0" required>
            </div>

            <hr>

            <h2>Serviço Desejado</h2>

            <div class="mb-3">
                <input type="checkbox"> Banho
                <br>
                <input type="checkbox"> Tosa
            </div>

            <hr>

            <h2>Agendamento</h2>

            <div class="mb-3">
                <label>Método de atendimento</label>
                <br>

                <input type="radio" name="agendamento"> Tele-busca
                <br>

                <input type="radio" name="agendamento"> Entrega no local
            </div>

            <div class="mb-3">
                <label>Data</label>
                <input type="date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Horário</label>
                <input type="time" class="form-control" required>
            </div>

            <button type="button" class="btn btn-primary" onclick="agendar()">
                Agendar
            </button>

        </form>

    </main>

    <footer>

        <hr>

        <p>Desenvolvido por Bernardo Kalata</p>

    </footer>

    <script src="js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
